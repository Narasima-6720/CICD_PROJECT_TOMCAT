---
name: Build and deploy into tomcat
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v3

      - name: Build code and generate the war file
        run: mvn clean package

      - name: Deploy into the tomcat
        run: |
              WAR_FILE=$(ls target/*.war | head -n 1)
              APP_NAME=mnrapp
              curl -u "${{ secrets.TOMCAT_USERNAME }}:${{ secrets.TOMCAT_PASSWORD }}" \
                --upload-file "$WAR_FILE" \
                "http://${{ secrets.TOMCAT_HOST }}:8080/manager/text/deploy?path=/$APP_NAME&update=true"
